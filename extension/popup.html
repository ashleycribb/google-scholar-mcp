<!DOCTYPE html>
<html>
<head>
  <title>Google Scholar Researcher</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
  <meta charset="utf-8">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Scholar Search</h1>
      <div class="tabs">
        <button id="tab-search" class="tab-btn active">Search</button>
        <button id="tab-saved" class="tab-btn">Saved Papers</button>
      </div>
    </div>

    <!-- Search View -->
    <div id="view-search" class="view active">
      <div class="search-box">
        <input type="text" id="query-input" placeholder="Enter topic, author, or keywords...">
        <button id="search-btn">Search</button>
      </div>
      <div id="loading" class="hidden">Searching...</div>
      <div id="search-results" class="results-list"></div>
      <div id="search-error" class="error-msg hidden"></div>
    </div>

    <!-- Saved View -->
    <div id="view-saved" class="view hidden">
      <div class="actions-bar">
        <button id="copy-all-btn" class="secondary-btn">Copy All to Clipboard</button>
        <button id="clear-all-btn" class="danger-btn">Clear All</button>
      </div>
      <div id="saved-list" class="results-list"></div>
      <div id="saved-empty" class="empty-msg hidden">No saved papers yet.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
